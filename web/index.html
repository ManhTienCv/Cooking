    </style>

    <!-- Early Browser Extension Protection Guard -->
    <script>
      (function() {
        try {
          function sanitizeEvent(e) {
            if (!e) return;
            if (typeof e.key === 'undefined' || e.key === null) {
              try {
                Object.defineProperty(e, 'key', { value: '', writable: true, configurable: true });
              } catch (_) {}
            }
            if (typeof e.code === 'undefined' || e.code === null) {
              try {
                Object.defineProperty(e, 'code', { value: '', writable: true, configurable: true });
              } catch (_) {}
            }
            if (e.target && typeof e.target.tagName === 'undefined') {
              try {
                Object.defineProperty(e.target, 'tagName', { value: '', writable: true, configurable: true });
              } catch (_) {}
            }
          }

          if (typeof KeyboardEvent !== 'undefined' && KeyboardEvent.prototype) {
            var kProp = Object.getOwnPropertyDescriptor(KeyboardEvent.prototype, 'key');
            if (kProp && kProp.get) {
              var origKey = kProp.get;
              Object.defineProperty(KeyboardEvent.prototype, 'key', {
                get: function() {
                  try {
                    var v = origKey.call(this);
                    return typeof v === 'string' ? v : '';
                  } catch (e) { return ''; }
                },
                configurable: true,
                enumerable: true
              });
            }
            var cProp = Object.getOwnPropertyDescriptor(KeyboardEvent.prototype, 'code');
            if (cProp && cProp.get) {
              var origCode = cProp.get;
              Object.defineProperty(KeyboardEvent.prototype, 'code', {
                get: function() {
                  try {
                    var v = origCode.call(this);
                    return typeof v === 'string' ? v : '';
                  } catch (e) { return ''; }
                },
                configurable: true,
                enumerable: true
              });
            }
          }

          if (typeof EventTarget !== 'undefined' && EventTarget.prototype && EventTarget.prototype.dispatchEvent) {
            var origDispatch = EventTarget.prototype.dispatchEvent;
            EventTarget.prototype.dispatchEvent = function(evt) {
              if (evt && (evt.type === 'keydown' || evt.type === 'keyup' || evt.type === 'keypress')) {
                sanitizeEvent(evt);
              }
              return origDispatch.apply(this, arguments);
            };
          }

          window.addEventListener('keydown', sanitizeEvent, true);
          window.addEventListener('keyup', sanitizeEvent, true);
          window.addEventListener('keypress', sanitizeEvent, true);
          document.addEventListener('keydown', sanitizeEvent, true);
          document.addEventListener('keyup', sanitizeEvent, true);
          document.addEventListener('keypress', sanitizeEvent, true);

          if (typeof console !== 'undefined' && console.error) {
            var origConsoleError = console.error;
            console.error = function() {
              try {
                var argsStr = '';
                for (var i = 0; i < arguments.length; i++) {
                  var arg = arguments[i];
                  if (typeof arg === 'string') {
                    argsStr += ' ' + arg;
                  } else if (arg) {
                    if (arg.message) argsStr += ' ' + arg.message;
                    if (arg.stack) argsStr += ' ' + arg.stack;
                  }
                }
                var s = argsStr.toLowerCase();
                if (s.indexOf('immersive translate') !== -1 ||
                    s.indexOf('immersivetranslate') !== -1 ||
                    s.indexOf('content_main.js') !== -1 ||
                    s.indexOf('chrome-extension://') !== -1 ||
                    s.indexOf('refreshactivecampaigntags') !== -1) {
                  return;
                }
              } catch (_) {}
              return origConsoleError.apply(console, arguments);
            };
          }

          window.addEventListener('error', function(e) {
            var src = (e.filename || '') + ' ' + (e.error && e.error.stack ? e.error.stack : '') + ' ' + (e.message || '');
            src = src.toLowerCase();
            if (src.indexOf('chrome-extension://') !== -1 || 
                src.indexOf('moz-extension://') !== -1 || 
                src.indexOf('content_main.js') !== -1 || 
                src.indexOf('content-script') !== -1 ||
                src.indexOf('istriggerkey') !== -1 ||
                src.indexOf('immersivetranslate') !== -1 ||
                src.indexOf('immersive translate') !== -1 ||
                src.indexOf('refreshactivecampaigntags') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>

    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Theme initialization (Trắng sáng mặc định, chỉ tối khi user đã bật trong Cài đặt) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || localStorage.theme;
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
