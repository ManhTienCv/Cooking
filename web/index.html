<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khám phá Ẩm thực Việt Nam - Hướng dẫn nấu ăn chi tiết" />
    <title>CookingBoy - Trang chủ | Khám phá Ẩm thực Việt Nam</title>
    
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Removed local CSS imports as they were redundant -->

    <style>
      html, body { 
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; 
      }
      html { scroll-behavior: auto; }
    </style>

    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Theme initialization (Trắng sáng mặc định, chỉ tối khi user đã bật trong Cài đặt) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || localStorage.theme;
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- External Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      // Automatically load Lucide icons if not running in React effect
      document.addEventListener("DOMContentLoaded", function() {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
    <script src="/assets/js/vanilla-tilt.js"></script>
  </body>
</html>
